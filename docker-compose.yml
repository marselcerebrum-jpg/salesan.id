# =============================================================================
# salesan.id — backend only.
#
# The database is Supabase (managed), so nothing is containerised for it here;
# point DATABASE_URL at your project. The frontend runs with `npm run dev` or is
# deployed to Vercel.
#
#   cp backend/.env.example backend/.env   # then fill it in
#   docker compose up --build
# =============================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: salesan/backend:latest
    container_name: salesan-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      PORT: '8080'
    ports:
      - '8080:8080'
    # Give whatsmeow time to close its sockets cleanly on shutdown.
    stop_grace_period: 45s
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
