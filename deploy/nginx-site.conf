# salesan.id behind the host's nginx — for a VPS where nginx already owns
# ports 80/443. Pairs with deploy/docker-compose.nginx.yml, which publishes the
# containers on 127.0.0.1:3180 (web) and 127.0.0.1:8180 (backend), and with
# the self-hosted Supabase gateway on 127.0.0.1:8000.
#
#   cp deploy/nginx-upgrade-map.conf /etc/nginx/conf.d/upgrade-map.conf
#   cp deploy/nginx-site.conf /etc/nginx/sites-available/salesan-id
#   ln -s /etc/nginx/sites-available/salesan-id /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d salesan.marseltech.cloud -d api.salesan.marseltech.cloud
#
# certbot rewrites these blocks to add the 443 listeners and the redirect.

# --- the application ---------------------------------------------------------
server {
    listen 80;
    server_name salesan.marseltech.cloud;

    location / {
        proxy_pass http://127.0.0.1:3180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- the API hostname: backend + self-hosted Supabase + Studio -----------------
#
# One hostname, split by path. The backend owns /health and /api/v1/; the
# Supabase gateway owns its /<service>/v1/ paths; Studio takes the root and
# its own /api/v1/projects/ (a path the backend never uses). Studio sits behind
# the gateway's basic auth (DASHBOARD_USERNAME / DASHBOARD_PASSWORD).
server {
    listen 80;
    server_name api.salesan.marseltech.cloud;

    # A broadcast document may be 100 MB; the Go server enforces the exact
    # per-kind ceilings, nginx only has to let it through.
    client_max_body_size 110m;

    location = /health {
        proxy_pass http://127.0.0.1:8180;
        proxy_set_header Host $host;
    }

    # Realtime: one long-lived WebSocket per open browser tab.
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location ^~ /api/v1/projects/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long requests (large uploads, exports); the Go server's own cap is 10 min.
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_request_buffering off;
    }

    # Supabase services (auth, storage, rest, realtime, functions).
    location ~ ^/(auth|storage|rest|realtime|functions)/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_request_buffering off;
    }

    # Supabase Studio.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
